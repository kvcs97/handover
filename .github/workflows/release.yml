name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Install GTK3/Pango für WeasyPrint (MSYS2)
        run: C:\msys64\usr\bin\pacman.exe --noconfirm -S mingw-w64-x86_64-pango
        shell: cmd

      - name: Build Python backend
        working-directory: backend
        run: |
          pip install pyinstaller==6.19.0
          pyinstaller handover.spec --clean

      - name: Copy backend as Tauri sidecar
        run: |
          mkdir frontend\src-tauri\binaries
          copy backend\dist\handover-backend.exe frontend\src-tauri\binaries\handover-backend-x86_64-pc-windows-msvc.exe
        shell: cmd

      - name: Verify sidecar exists
        shell: powershell
        run: |
          $path = "frontend\src-tauri\binaries\handover-backend-x86_64-pc-windows-msvc.exe"
          if (Test-Path $path) {
            Write-Host "OK: sidecar found"
            Get-Item $path | Select-Object Name, Length
          } else {
            Write-Error "ERROR: sidecar NOT found!"
            exit 1
          }

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: Build Tauri app
        working-directory: frontend
        run: npm run tauri build -- --verbose
        shell: powershell

      - name: Debug — Bundle-Verzeichnis anzeigen
        if: always()
        shell: powershell
        run: |
          $bundleDir = "frontend\src-tauri\target\release\bundle"
          Write-Host "=== Bundle directory: $bundleDir ==="
          if (Test-Path $bundleDir) {
            Get-ChildItem -Recurse $bundleDir | Select-Object FullName, Length | Format-Table
          } else {
            Write-Host "BUNDLE DIRECTORY DOES NOT EXIST — build failed before bundling"
          }
          Write-Host ""
          Write-Host "=== target\release\ (top level) ==="
          Get-ChildItem "frontend\src-tauri\target\release\" -File | Select-Object Name, Length | Format-Table

      - name: Create GitHub Release + Upload Installer
        shell: powershell
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $nsisExe  = "frontend\src-tauri\target\release\bundle\nsis\HandOver_${version}_x64-setup.exe"
          $nsisSig  = "${nsisExe}.sig"
          $msiFile  = "frontend\src-tauri\target\release\bundle\msi\HandOver_${version}_x64_en-US.msi"
          $msiSig   = "${msiFile}.sig"

          if (-not (Test-Path $nsisExe)) {
            Write-Error "NSIS installer not found: $nsisExe"
            exit 1
          }
          Write-Host "NSIS installer found: $(Get-Item $nsisExe | Select-Object -ExpandProperty Length) bytes"

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: HandOver ${{ github.ref_name }}
          body: |
            ## HandOver ${{ github.ref_name }}

            ### Installation
            - **Standard:** `HandOver_*_x64-setup.exe` herunterladen und ausführen
            - **Ohne Installer (Portable):** `HandOver_*_portable.zip` herunterladen, entpacken, `HandOver.exe` starten

            > Automatisches Update über den Update-Banner in der App verfügbar.
          files: |
            frontend/src-tauri/target/release/bundle/nsis/*.exe
            frontend/src-tauri/target/release/bundle/nsis/*.sig
            frontend/src-tauri/target/release/bundle/msi/*.msi
            frontend/src-tauri/target/release/bundle/msi/*.sig
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate latest.json
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $nsisExe = "frontend\src-tauri\target\release\bundle\nsis\HandOver_${version}_x64-setup.exe"
          $msiFile = "frontend\src-tauri\target\release\bundle\msi\HandOver_${version}_x64_en-US.msi"

          $nsisSig = if (Test-Path "${nsisExe}.sig") { (Get-Content "${nsisExe}.sig" -Raw).Trim() } else { "" }
          $msiSig  = if (Test-Path "${msiFile}.sig")  { (Get-Content "${msiFile}.sig"  -Raw).Trim() } else { "" }

          if (-not $nsisSig -and -not $msiSig) {
            Write-Error "Keine .sig Dateien gefunden — kann latest.json nicht erstellen"
            exit 1
          }

          $pubDate = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ss.fffZ")
          $baseUrl = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}"

          $platforms = [ordered]@{}
          if ($nsisSig) {
            $platforms["windows-x86_64"]      = [ordered]@{ signature = $nsisSig; url = "$baseUrl/HandOver_${version}_x64-setup.exe" }
            $platforms["windows-x86_64-nsis"] = [ordered]@{ signature = $nsisSig; url = "$baseUrl/HandOver_${version}_x64-setup.exe" }
          }
          if ($msiSig) {
            $platforms["windows-x86_64-msi"]  = [ordered]@{ signature = $msiSig; url = "$baseUrl/HandOver_${version}_x64_en-US.msi" }
          }

          $json = [ordered]@{
            version  = $version
            notes    = "HandOver ${{ github.ref_name }}"
            pub_date = $pubDate
            platforms = $platforms
          } | ConvertTo-Json -Depth 10

          [System.IO.File]::WriteAllBytes("latest.json", [System.Text.UTF8Encoding]::new($false).GetBytes($json))
          Write-Host "latest.json:"
          Get-Content latest.json

      - name: Upload latest.json
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build portable ZIP
        shell: powershell
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $portableDir = "HandOver_portable"
          New-Item -ItemType Directory -Force -Path $portableDir

          Copy-Item "frontend\src-tauri\target\release\handover.exe" "$portableDir\HandOver.exe"

          # Sidecar aus binaries-Ordner kopieren (target\release hat kein handover-backend.exe)
          $sidecar = "frontend\src-tauri\binaries\handover-backend-x86_64-pc-windows-msvc.exe"
          if (Test-Path $sidecar) {
            Copy-Item $sidecar "$portableDir\handover-backend.exe"
          }

          @"
          @echo off
          start "" HandOver.exe
          "@ | Out-File -FilePath "$portableDir\start.bat" -Encoding ASCII

          @"
          HandOver ${{ github.ref_name }} — Portable Version
          ===================================================
          Keine Installation nötig!

          Starten: Doppelklick auf start.bat
          Oder:    HandOver.exe direkt starten

          Hinweis: Beim ersten Start kann Windows SmartScreen eine Warnung zeigen.
          -> "Weitere Informationen" -> "Trotzdem ausführen" klicken.

          © 2026 Shoriu
          "@ | Out-File -FilePath "$portableDir\README.txt" -Encoding UTF8

          $zipName = "HandOver_${version}_portable.zip"
          Compress-Archive -Path "$portableDir\*" -DestinationPath $zipName -Force
          Write-Host "Portable ZIP: $zipName ($(Get-Item $zipName | Select-Object -ExpandProperty Length) bytes)"

      - name: Upload portable ZIP
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: HandOver_*_portable.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
